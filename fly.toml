# fly.toml app configuration file generated for selfllm on 2026-06-18T21:33:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'selfllm'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # torch plus a loaded model does not fit the old 256 MB (it OOMs on import),
  # and the two memory keys conflicted. Give the inference VM real headroom.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
