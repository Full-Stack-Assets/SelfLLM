name: Deploy to Fly.io

# Continuous deployment of the SelfLLM inference API to Fly.io (see fly.toml).
#
# Runs on pushes to main that touch the app, and on manual dispatch. The job
# is a no-op unless a FLY_API_TOKEN secret is configured, so forks and repos
# without Fly.io set up are never blocked by a failing deploy. Add the token
# under Settings -> Secrets and variables -> Actions to activate deployment.

on:
  push:
    branches: [main]
    paths:
      - "selfllm/**"
      - "requirements.txt"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy inference API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Fly.io credentials
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not set — skipping deploy (configure the secret to enable)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.guard.outputs.enabled == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.guard.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
