# Vercel's Python builder runs `uv`, which requires a [project] table here.
# Package builds for distribution are still handled by setup.py; this file
# exists primarily to declare the Vercel deployment entrypoint and to give uv
# a resolvable, slim dependency set for the serverless deployment environment.

[project]
name = "selfllm"
version = "0.1.0"
description = "A recursively self-improving foundation language model"
readme = "README.md"
requires-python = ">=3.9"
# Runtime dependencies for the Vercel deployment, which serves the slim
# torch-free gateway (vercel_gateway:app): landing page, pricing, and a
# reverse proxy to the Fly.io inference API. torch is deliberately ABSENT --
# even the CPU wheel pushes the function bundle to ~780 MB, over Vercel's
# 500 MB limit (this is why the previous full-server deployments all failed).
# Inference runs on Fly.io (fly.toml); the full training/serving dependency
# set lives in requirements.txt / setup.py. CI installs torch and numpy
# explicitly before `pip install -e ".[dev]"`, so their absence here does not
# affect CI.
dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.109.1",
    "uvicorn>=0.30.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.3",
    "jinja2>=3.1.6",
    "httpx>=0.27.0",
]

# Optional groups, mirroring setup.py's extras. These are NOT bundled into the
# Vercel deployment (uv installs only the default dependencies above); they
# exist so `pip install -e ".[dev]"` in CI restores the full dependency set --
# notably gradio, which the dashboard module (and tests/test_dashboard.py)
# imports at module load.
[project.optional-dependencies]
dashboard = ["gradio>=4.44.1"]
rag = ["faiss-cpu>=1.7.0"]
dev = [
    "gradio>=4.44.1",
    "pytest>=7.4.4",
    "pytest-cov>=5.0.0",
]

[tool.uv]
# Don't try to build/install the selfllm package itself; uv only needs to
# resolve and install the dependencies above. The application code is imported
# from the repository root, matching the prior requirements.txt-based build.
package = false

# Vercel deployment configuration.
#
# Serve the slim gateway app (no torch) instead of the full inference server:
# the full server's torch dependency cannot fit Vercel's 500 MB function
# limit. The gateway proxies /v1/* to the Fly.io inference deployment.
[tool.vercel]
entrypoint = "vercel_gateway:app"
